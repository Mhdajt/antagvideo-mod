name: Build and Release Video Player Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract clean source assets
        run: |
          mkdir -p project
          unzip -q antagvideo_clean_source.zip -d project
          if [ -d project/clean_video_mod ]; then
            cp -r project/clean_video_mod/* project/
            rm -rf project/clean_video_mod
          fi

      - name: Configure Video Player Mod for Fabric 26.2
        working-directory: project
        run: |
          cat << 'BUILD_GRADLE' > build.gradle
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          BUILD_GRADLE

          cat << 'PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          org.gradle.configuration-cache=false

          minecraft_version=26.2
          loader_version=0.19.3
          loom_version=1.17-SNAPSHOT

          mod_version=1.4.0
          maven_group=com.antagvideo
          archives_base_name=VideoPlayer

          fabric_api_version=0.150.1+26.2
          PROPS

          cat << 'SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = "https://maven.fabricmc.net/" }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'VideoPlayer'
          SETTINGS

          cat << 'MOD_JSON' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "antagvideo",
            "version": "${version}",
            "name": "Video Player",
            "description": "Fullscreen video cutscene player for Fabric 26.2. Command: /videoplay <video> [player]",
            "authors": [
              "Mhdajt"
            ],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": [
                "com.antagvideo.AntagVideoMod"
              ],
              "client": [
                "com.antagvideo.client.AntagVideoClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.19.1",
              "minecraft": ">=26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          MOD_JSON

          cat << 'SOUNDS_JSON' > src/main/resources/assets/antagvideo/sounds.json
          {
            "intro": {
              "category": "master",
              "sounds": [
                {
                  "name": "antagvideo:intro",
                  "stream": true
                }
              ]
            },
            "audio": {
              "category": "master",
              "sounds": [
                {
                  "name": "antagvideo:intro",
                  "stream": true
                }
              ]
            }
          }
          SOUNDS_JSON

          mkdir -p src/main/java/com/antagvideo/client

          cat << 'PAYLOAD' > src/main/java/com/antagvideo/PlayVideoPayload.java
          package com.antagvideo;

          import net.minecraft.network.FriendlyByteBuf;
          import net.minecraft.network.codec.StreamCodec;
          import net.minecraft.network.protocol.common.custom.CustomPacketPayload;
          import net.minecraft.resources.Identifier;

          public record PlayVideoPayload(String name) implements CustomPacketPayload {
              public static final Type<PlayVideoPayload> TYPE =
                  new Type<>(Identifier.fromNamespaceAndPath("antagvideo", "play_video"));

              public static final StreamCodec<FriendlyByteBuf, PlayVideoPayload> CODEC =
                  StreamCodec.of(
                      (buf, payload) -> buf.writeUtf(payload.name()),
                      buf -> new PlayVideoPayload(buf.readUtf())
                  );

              @Override
              public Type<? extends CustomPacketPayload> type() {
                  return TYPE;
              }
          }
          PAYLOAD

          cat << 'MOD_JAVA' > src/main/java/com/antagvideo/AntagVideoMod.java
          package com.antagvideo;

          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;
          import net.minecraft.commands.Commands;
          import net.minecraft.commands.SharedSuggestionProvider;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerPlayer;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          import java.util.Collection;
          import java.util.List;

          public class AntagVideoMod implements ModInitializer {
              public static final String MOD_ID = "antagvideo";
              public static final Logger LOGGER = LoggerFactory.getLogger("VideoPlayer");
              public static final String[] AVAILABLE_VIDEOS = new String[] { "Intro" };

              @Override
              public void onInitialize() {
                  LOGGER.info("Video Player mod loaded - use /videoplay <video> [player]");

                  PayloadTypeRegistry.clientboundPlay().register(PlayVideoPayload.TYPE, PlayVideoPayload.CODEC);

                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) -> {
                      // /videoplay <video> [player]
                      dispatcher.register(Commands.literal("videoplay")
                          .executes(ctx -> {
                              ctx.getSource().sendSuccess(() -> Component.literal("§6§l=== Video Player ==="), false);
                              ctx.getSource().sendSuccess(() -> Component.literal("§eUsage: §f/videoplay <video> [player]"), false);
                              ctx.getSource().sendSuccess(() -> Component.literal("§7Available videos: §bIntro"), false);
                              return 1;
                          })
                          .then(Commands.argument("video", StringArgumentType.word())
                              .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(AVAILABLE_VIDEOS, builder))
                              .executes(ctx -> {
                                  String video = StringArgumentType.getString(ctx, "video");
                                  ServerPlayer self = ctx.getSource().getPlayer();
                                  if (self != null) {
                                      return send(List.of(self), video);
                                  }
                                  return 0;
                              })
                              .then(Commands.argument("player", StringArgumentType.word())
                                  .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(ctx.getSource().getOnlinePlayerNames(), builder))
                                  .executes(ctx -> {
                                      String video = StringArgumentType.getString(ctx, "video");
                                      String targetName = StringArgumentType.getString(ctx, "player");

                                      if ("@a".equalsIgnoreCase(targetName) || "all".equalsIgnoreCase(targetName)) {
                                          return send(ctx.getSource().getServer().getPlayerList().getPlayers(), video);
                                      }

                                      ServerPlayer target = ctx.getSource().getServer().getPlayerList().getPlayerByName(targetName);
                                      if (target != null) {
                                          return send(List.of(target), video);
                                      }

                                      for (ServerPlayer p : ctx.getSource().getServer().getPlayerList().getPlayers()) {
                                          if (p.getName().getString().equalsIgnoreCase(targetName)) {
                                              return send(List.of(p), video);
                                          }
                                      }

                                      ctx.getSource().sendFailure(Component.literal("Player not found: " + targetName));
                                      return 0;
                                  })
                              )
                          )
                      );

                      // /videostop [player]
                      dispatcher.register(Commands.literal("videostop")
                          .executes(ctx -> {
                              ServerPlayer self = ctx.getSource().getPlayer();
                              if (self != null) {
                                  return send(List.of(self), "stop");
                              }
                              return 0;
                          })
                          .then(Commands.argument("player", StringArgumentType.word())
                              .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(ctx.getSource().getOnlinePlayerNames(), builder))
                              .executes(ctx -> {
                                  String targetName = StringArgumentType.getString(ctx, "player");
                                  if ("@a".equalsIgnoreCase(targetName) || "all".equalsIgnoreCase(targetName)) {
                                      return send(ctx.getSource().getServer().getPlayerList().getPlayers(), "stop");
                                  }
                                  ServerPlayer target = ctx.getSource().getServer().getPlayerList().getPlayerByName(targetName);
                                  if (target != null) {
                                      return send(List.of(target), "stop");
                                  }
                                  return 0;
                              })
                          )
                      );
                  });
              }

              private static int send(Collection<ServerPlayer> players, String video) {
                  PlayVideoPayload payload = new PlayVideoPayload(video);
                  for (ServerPlayer player : players) {
                      ServerPlayNetworking.send(player, payload);
                  }
                  return players.size();
              }
          }
          MOD_JAVA

          cat << 'PLAYER_JAVA' > src/main/java/com/antagvideo/client/VideoPlayer.java
package com.antagvideo.client;

import com.antagvideo.AntagVideoMod;
import com.mojang.blaze3d.platform.NativeImage;
import net.minecraft.client.Minecraft;
import net.minecraft.client.renderer.texture.DynamicTexture;
import net.minecraft.client.resources.sounds.SimpleSoundInstance;
import net.minecraft.resources.Identifier;
import net.minecraft.sounds.SoundEvent;

import java.io.ByteArrayInputStream;
import java.io.InputStream;
import java.util.concurrent.ArrayBlockingQueue;
import java.util.concurrent.TimeUnit;

public final class VideoPlayer {
    public static final Identifier TEXTURE = Identifier.fromNamespaceAndPath(AntagVideoMod.MOD_ID, "video_frame");
    public static volatile String mode = "fit";

    public static final int TOTAL_FRAMES = 402;
    public static final double FPS = 402.0 / 42.84;
    public static final double DURATION = 42.84;

    private record Frame(int index, NativeImage image) {}

    private static volatile boolean running;
    private static volatile boolean decoderDone;
    private static volatile long startNanos;
    private static ArrayBlockingQueue<Frame> queue;
    private static Thread thread;
    private static SimpleSoundInstance sound;
    private static DynamicTexture texture;
    private static int texW = 854;
    private static int texH = 392;

    public static volatile String statusMessage = "Idle";
    public static volatile int currentFrameIndex = 0;

    private VideoPlayer() {}

    public static byte[] loadFrameBytes(int frame) {
        String filename = String.format("%04d.jpg", frame);
        String relativePath = "assets/antagvideo/textures/frames/" + filename;

        // 1. Thread Context ClassLoader
        try {
            ClassLoader ccl = Thread.currentThread().getContextClassLoader();
            if (ccl != null) {
                try (InputStream is = ccl.getResourceAsStream(relativePath)) {
                    if (is != null) return is.readAllBytes();
                }
            }
        } catch (Throwable ignored) {}

        // 2. Class.getClassLoader()
        try {
            ClassLoader cl = VideoPlayer.class.getClassLoader();
            if (cl != null) {
                try (InputStream is = cl.getResourceAsStream(relativePath)) {
                    if (is != null) return is.readAllBytes();
                }
            }
        } catch (Throwable ignored) {}

        // 3. VideoPlayer.class.getResourceAsStream (without leading slash)
        try {
            try (InputStream is = VideoPlayer.class.getResourceAsStream(relativePath)) {
                if (is != null) return is.readAllBytes();
            }
        } catch (Throwable ignored) {}

        // 4. VideoPlayer.class.getResourceAsStream (with leading slash)
        try {
            try (InputStream is = VideoPlayer.class.getResourceAsStream("/" + relativePath)) {
                if (is != null) return is.readAllBytes();
            }
        } catch (Throwable ignored) {}

        // 5. Minecraft ResourceManager (client)
        try {
            Identifier id = Identifier.fromNamespaceAndPath(AntagVideoMod.MOD_ID, "textures/frames/" + filename);
            var res = Minecraft.getInstance().getResourceManager().getResource(id);
            if (res.isPresent()) {
                try (InputStream is = res.get().open()) {
                    return is.readAllBytes();
                }
            }
        } catch (Throwable ignored) {}

        // 6. FabricLoader ModContainer.findPath()
        try {
            var modOpt = net.fabricmc.loader.api.FabricLoader.getInstance().getModContainer(AntagVideoMod.MOD_ID);
            if (modOpt.isPresent()) {
                var pathOpt = modOpt.get().findPath(relativePath);
                if (pathOpt.isPresent()) {
                    return java.nio.file.Files.readAllBytes(pathOpt.get());
                }
            }
        } catch (Throwable ignored) {}

        return null;
    }

    public static synchronized String start(String name) {
        stop();

        if (!"intro".equalsIgnoreCase(name)) {
            return "Video not found: " + name + ". Available: Intro";
        }

        statusMessage = "Loading frame 1...";
        currentFrameIndex = 1;

        // Synchronously preload frame 1
        byte[] bytes = loadFrameBytes(1);
        if (bytes != null && bytes.length > 0) {
            try {
                NativeImage img = null;
                try {
                    img = NativeImage.read(bytes);
                } catch (Throwable t) {
                    img = NativeImage.read(new ByteArrayInputStream(bytes));
                }
                if (img != null) {
                    texW = img.getWidth();
                    texH = img.getHeight();
                    DynamicTexture old = texture;
                    texture = new DynamicTexture(() -> "antagvideo video", img);
                    Minecraft.getInstance().getTextureManager().register(TEXTURE, texture);
                    if (old != null) {
                        try { old.close(); } catch (Throwable ignored) {}
                    }
                    statusMessage = "Frame 1 loaded (" + texW + "x" + texH + ")";
                }
            } catch (Throwable e) {
                AntagVideoMod.LOGGER.error("Error preloading frame 1: {}", e.getMessage());
                statusMessage = "Frame 1 decode error: " + e.getMessage();
            }
        } else {
            AntagVideoMod.LOGGER.error("Could not find frame 1 at assets/antagvideo/textures/frames/0001.jpg");
            statusMessage = "Could not locate 0001.jpg in jar";
        }

        // Start synchronized audio
        try {
            Identifier soundId = Identifier.fromNamespaceAndPath(AntagVideoMod.MOD_ID, "intro");
            SoundEvent event = SoundEvent.createVariableRangeEvent(soundId);
            sound = SimpleSoundInstance.forUI(event, 1.0f);
            Minecraft.getInstance().getSoundManager().play(sound);
        } catch (Exception e) {
            AntagVideoMod.LOGGER.warn("Audio note: {}", e.getMessage());
        }

        queue = new ArrayBlockingQueue<>(16);
        running = true;
        decoderDone = false;
        startNanos = System.nanoTime();

        thread = new Thread(VideoPlayer::decodeLoop, "VideoPlayer-Decoder");
        thread.setDaemon(true);
        thread.start();

        return null;
    }

    public static long due() {
        return (long) ((System.nanoTime() - startNanos) * FPS / 1.0e9) + 1;
    }

    public static double elapsedSeconds() {
        return Math.max(0.0, (System.nanoTime() - startNanos) / 1.0e9);
    }

    private static void decodeLoop() {
        try {
            for (int i = 1; i <= TOTAL_FRAMES && running; i++) {
                // Pacing: don't decode too far ahead
                while (running && i > due() + 4) {
                    Thread.sleep(10);
                }
                if (!running) break;

                // Frame drop: if device is falling behind audio, skip ahead to stay in sync
                if (i < due() - 1 && i < TOTAL_FRAMES) {
                    continue;
                }

                byte[] bytes = loadFrameBytes(i);
                if (bytes == null || bytes.length == 0) {
                    continue;
                }

                NativeImage img = null;
                try {
                    img = NativeImage.read(bytes);
                } catch (Throwable t) {
                    try {
                        img = NativeImage.read(new ByteArrayInputStream(bytes));
                    } catch (Throwable t2) {
                        AntagVideoMod.LOGGER.error("NativeImage decode failed frame {}: {}", i, t2.getMessage());
                    }
                }

                if (img == null) {
                    continue;
                }

                Frame frame = new Frame(i, img);
                boolean queued = false;
                while (running && !queued) {
                    queued = queue.offer(frame, 20, TimeUnit.MILLISECONDS);
                }
                if (!queued) {
                    img.close();
                }
            }
        } catch (Exception e) {
            AntagVideoMod.LOGGER.error("Decoder error: {}", e.getMessage());
            statusMessage = "Decoder crash: " + e.getMessage();
        } finally {
            decoderDone = true;
        }
    }

    public static void pullFrame() {
        ArrayBlockingQueue<Frame> q = queue;
        if (q == null || !running) {
            return;
        }
        long due = due();
        Frame latest = null;
        Frame f;
        while ((f = q.peek()) != null && f.index() <= due) {
            q.poll();
            if (latest != null) {
                latest.image().close();
            }
            latest = f;
        }
        if (latest != null) {
            currentFrameIndex = latest.index();
            NativeImage image = latest.image();
            try {
                texW = image.getWidth();
                texH = image.getHeight();
                DynamicTexture old = texture;
                texture = new DynamicTexture(() -> "antagvideo video", image);
                Minecraft.getInstance().getTextureManager().register(TEXTURE, texture);
                if (old != null) {
                    try { old.close(); } catch (Throwable ignored) {}
                }
                statusMessage = "Playing frame " + currentFrameIndex;
            } catch (Throwable t) {
                AntagVideoMod.LOGGER.error("DynamicTexture error: {}", t.getMessage());
                statusMessage = "Texture update error: " + t.getMessage();
                try { image.close(); } catch (Throwable ignored) {}
            }
        }
    }

    public static synchronized void stop() {
        running = false;
        if (thread != null) {
            thread.interrupt();
            thread = null;
        }
        if (queue != null) {
            Frame f;
            while ((f = queue.poll()) != null) {
                try { f.image().close(); } catch (Exception ignored) {}
            }
            queue = null;
        }
        if (sound != null) {
            try { Minecraft.getInstance().getSoundManager().stop(sound); } catch (Exception ignored) {}
            sound = null;
        }
        if (texture != null) {
            try {
                Minecraft.getInstance().getTextureManager().release(TEXTURE);
                texture.close();
            } catch (Exception ignored) {}
                texture = null;
        }
        statusMessage = "Stopped";
    }

    public static boolean isFinished() {
        ArrayBlockingQueue<Frame> q = queue;
        return running && decoderDone && q != null && q.isEmpty() && due() >= TOTAL_FRAMES;
    }

    public static boolean hasTexture() { return texture != null; }
    public static int texWidth() { return texW > 0 ? texW : 854; }
    public static int texHeight() { return texH > 0 ? texH : 392; }
}
PLAYER_JAVA

          cat << 'SCREEN_JAVA' > src/main/java/com/antagvideo/client/VideoPlayerScreen.java
package com.antagvideo.client;

import net.minecraft.client.gui.GuiGraphicsExtractor;
import net.minecraft.client.gui.screens.Screen;
import net.minecraft.client.renderer.RenderPipelines;
import net.minecraft.network.chat.Component;

public class VideoPlayerScreen extends Screen {
    public VideoPlayerScreen() {
        super(Component.literal("Video Player"));
    }

    @Override
    public boolean isPauseScreen() {
        return false;
    }

    @Override
    public boolean shouldCloseOnEsc() {
        return true;
    }

    @Override
    public void removed() {
        VideoPlayer.stop();
    }

    @Override
    public void extractRenderState(GuiGraphicsExtractor g, int mouseX, int mouseY, float delta) {
        VideoPlayer.pullFrame();
        g.fill(0, 0, this.width, this.height, 0xFF000000);

        if (VideoPlayer.hasTexture()) {
            int tw = Math.max(1, VideoPlayer.texWidth());
            int th = Math.max(1, VideoPlayer.texHeight());
            String mode = VideoPlayer.mode;

            if ("cover".equals(mode)) {
                double s = Math.max((double) this.width / tw, (double) this.height / th);
                int rw = Math.min(tw, (int) Math.ceil(this.width / s));
                int rh = Math.min(th, (int) Math.ceil(this.height / s));
                g.blit(RenderPipelines.GUI_TEXTURED, VideoPlayer.TEXTURE,
                    0, 0, (float) ((tw - rw) / 2), (float) ((th - rh) / 2), this.width, this.height, rw, rh, tw, th);
            } else if ("stretch".equals(mode)) {
                g.blit(RenderPipelines.GUI_TEXTURED, VideoPlayer.TEXTURE,
                    0, 0, 0.0f, 0.0f, this.width, this.height, tw, th);
            } else { // default "fit" - cinematic aspect ratio with black bars
                double s = Math.min((double) this.width / tw, (double) this.height / th);
                int dw = (int) (tw * s);
                int dh = (int) (th * s);
                int x = (this.width - dw) / 2;
                int y = (this.height - dh) / 2;
                g.blit(RenderPipelines.GUI_TEXTURED, VideoPlayer.TEXTURE,
                    x, y, 0.0f, 0.0f, dw, dh, tw, th);
            }
        } else {
            // Diagnostic info if texture is not ready
            g.text(this.font, Component.literal("§c[Video Player] " + VideoPlayer.statusMessage), 20, this.height / 2, 0xFFFF55, true);
            g.text(this.font, Component.literal("§7Frame: " + VideoPlayer.currentFrameIndex + "/" + VideoPlayer.TOTAL_FRAMES), 20, this.height / 2 + 15, 0xAAAAAA, true);
        }

        // Progress bar at the bottom
        int barH = 3;
        int prog = (int) Math.min(this.width, (VideoPlayer.elapsedSeconds() / VideoPlayer.DURATION) * this.width);
        g.fill(0, this.height - barH, prog, this.height, 0xFF00E676);
        g.fill(prog, this.height - barH, this.width, this.height, 0x44222222);

        super.extractRenderState(g, mouseX, mouseY, delta);

        if (VideoPlayer.isFinished()) {
            this.onClose();
        }
    }
}
SCREEN_JAVA

          cat << 'CLIENT_JAVA' > src/main/java/com/antagvideo/client/AntagVideoClient.java
          package com.antagvideo.client;

          import com.antagvideo.AntagVideoMod;
          import com.antagvideo.PlayVideoPayload;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommands;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.Minecraft;
          import net.minecraft.commands.SharedSuggestionProvider;
          import net.minecraft.network.chat.Component;

          public class AntagVideoClient implements ClientModInitializer {
              private static volatile String pendingVideo;

              public static void requestPlay(String video) {
                  pendingVideo = video;
              }

              @Override
              public void onInitializeClient() {
                  // Handle server-directed playback packets
                  ClientPlayNetworking.registerGlobalReceiver(PlayVideoPayload.TYPE, (payload, context) -> {
                      requestPlay(payload.name());
                  });

                  // Open screen once chat screen is closed
                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      String video = pendingVideo;
                      if (video == null) {
                          return;
                      }

                      // If chat screen is open, close it first
                      if (mc.gui.screen() instanceof net.minecraft.client.gui.screens.ChatScreen) {
                          mc.setScreenAndShow(null);
                          return;
                      }

                      pendingVideo = null;

                      if ("stop".equalsIgnoreCase(video)) {
                          VideoPlayer.stop();
                          if (mc.gui.screen() instanceof VideoPlayerScreen) {
                              mc.setScreenAndShow(null);
                          }
                          return;
                      }

                      String error = VideoPlayer.start(video);
                      if (error != null) {
                          if (mc.player != null) {
                              mc.player.sendSystemMessage(Component.literal("§c[Video Player] " + error));
                          }
                      } else {
                          mc.setScreenAndShow(new VideoPlayerScreen());
                      }
                  });

                  // Client-side command registration for /videoplay <video> [player] and /videostop
                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, buildContext) -> {
                      dispatcher.register(ClientCommands.literal("videoplay")
                          .executes(ctx -> {
                              ctx.getSource().sendFeedback(Component.literal("§6§l=== Video Player ==="));
                              ctx.getSource().sendFeedback(Component.literal("§eUsage: §f/videoplay <video> [player]"));
                              ctx.getSource().sendFeedback(Component.literal("§7Available videos: §bIntro"));
                              return 1;
                          })
                          .then(ClientCommands.argument("video", StringArgumentType.word())
                              .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(AntagVideoMod.AVAILABLE_VIDEOS, builder))
                              .executes(ctx -> {
                                  String video = StringArgumentType.getString(ctx, "video");
                                  requestPlay(video);
                                  return 1;
                              })
                              .then(ClientCommands.argument("player", StringArgumentType.word())
                                  .suggests((ctx, builder) -> SharedSuggestionProvider.suggest(ctx.getSource().getOnlinePlayerNames(), builder))
                                  .executes(ctx -> {
                                      String video = StringArgumentType.getString(ctx, "video");
                                      String player = StringArgumentType.getString(ctx, "player");
                                      Minecraft mc = Minecraft.getInstance();
                                      if (mc.player != null && !player.equalsIgnoreCase(mc.player.getName().getString()) && mc.getConnection() != null) {
                                          mc.getConnection().sendCommand("videoplay " + video + " " + player);
                                      } else {
                                          requestPlay(video);
                                      }
                                      return 1;
                                  })
                              )
                          )
                      );

                      dispatcher.register(ClientCommands.literal("videostop")
                          .executes(ctx -> {
                              requestPlay("stop");
                              ctx.getSource().sendFeedback(Component.literal("§c⏹ Video stopped"));
                              return 1;
                          })
                      );

                      dispatcher.register(ClientCommands.literal("antagmode")
                          .then(ClientCommands.literal("fit").executes(ctx -> {
                              VideoPlayer.mode = "fit";
                              ctx.getSource().sendFeedback(Component.literal("§aVideo display mode: fit (cinematic black bars)"));
                              return 1;
                          }))
                          .then(ClientCommands.literal("stretch").executes(ctx -> {
                              VideoPlayer.mode = "stretch";
                              ctx.getSource().sendFeedback(Component.literal("§aVideo display mode: stretch (fullscreen)"));
                              return 1;
                          }))
                          .then(ClientCommands.literal("cover").executes(ctx -> {
                              VideoPlayer.mode = "cover";
                              ctx.getSource().sendFeedback(Component.literal("§aVideo display mode: cover (crop to fill)"));
                              return 1;
                          }))
                      );
                  });
              }
          }
          CLIENT_JAVA

          rm -f src/main/java/com/antagvideo/command/VideoCommand.java
          rm -f src/main/java/com/antagvideo/client/VideoRenderer.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build with Gradle
        working-directory: project
        run: gradle build --no-daemon --stacktrace

      - name: Upload the mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-1.4.0-jar
          path: project/build/libs/*.jar

      - name: Publish Ready-to-Install JAR to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR_FILE=$(ls project/build/libs/VideoPlayer-[0-9]*.jar | grep -v sources | head -n 1)
          echo "Found compiled mod jar: $JAR_FILE"
          
          gh release delete v1.4.0 --yes || true
          git tag -d v1.4.0 || true
          git push origin :refs/tags/v1.4.0 || true

          cat << 'NOTES' > /tmp/release_notes.md
          ### Video Player v1.4.0 for Fabric 26.2

          Fixed frame loading and screen rendering for both PC and Android (MJLauncher)!

          #### What was fixed:
          1. **Frame Loading**: Added multi-tier resource resolution with `ClassLoader.getResourceAsStream("assets/antagvideo/textures/frames/%04d.jpg")` (no leading slash), FabricLoader `ModContainer.findPath()`, and Minecraft's `ResourceManager`. Works reliably inside mod JARs on both PC and Android (MJLauncher/PojavLauncher).
          2. **No Black Screen**: Synchronously decodes and uploads frame 1 before screen presentation so the texture is immediately valid on display.
          3. **DynamicTexture & NativeImage**: Proper RGBA pixel decoding with STB memory buffers and GPU texture upload.
          4. **Audio & Frame Sync**: Real-time elapsed nanosecond synchronization with adaptive frame pacing and frame dropping to prevent desync on mobile CPUs.
          5. **Command**: `/videoplay <video> [player]` with dropdown autocompletion for `Intro`, optional simple-string player argument, and tick-synchronized screen opening after chat input.
          6. **Mod Name**: **Video Player** (Fabric 26.2).
          NOTES

          gh release create v1.4.0 "$JAR_FILE" \
            --title "Video Player v1.4.0 (Fabric 26.2)" \
            --notes-file /tmp/release_notes.md
